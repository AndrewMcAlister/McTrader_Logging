[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mctrader-logging"
version = "0.1.0"
description = "The estate's log sink and its fire-and-forget client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pyodbc>=5.0",
    "requests>=2.31",
    "mcp<2",
    "httpx>=0.27",
]

[project.scripts]
mctrader-logging = "mctrader_logging.service:main"
mctrader-logging-mcp = "mctrader_logging.mcp_server:main"

[tool.setuptools]
packages = ["mctrader_logging"]
